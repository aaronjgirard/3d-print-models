# Camera light on SoC pin gpio67 (GPIO2_A3). The stock screen app (mksclient)
# owns the pin through sysfs; Klipper switches it by writing the same sysfs
# value file, so the touchscreen button and LIGHT_ON / LIGHT_OFF both work.
# Needs klippy/extras/gcode_shell_command.py and /usr/local/bin/cameralight.
[gcode_shell_command _cameralight]
command: sudo /usr/local/bin/cameralight
timeout: 5
verbose: False

[gcode_macro LIGHT_ON]
gcode:
  RUN_SHELL_COMMAND CMD=_cameralight PARAMS=1

[gcode_macro LIGHT_OFF]
gcode:
  RUN_SHELL_COMMAND CMD=_cameralight PARAMS=0
