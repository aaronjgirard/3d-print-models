# PrusaSlicer 2.7 stand-in for the OrcaSlicer setup the track is printed with (../cli_slice style track_pla, which
# is the Orca settings in README.md): Sovol SV06 ACE 0.4 nozzle, Generic PLA with the PLA changes, 0.20mm Standard
# @Sovol SV06 ACE with its stock speeds and accelerations, 3 walls, 4 top and 3 bottom shell layers. Values copied
# from the config block of an Orca G-code sliced with track_pla (Nov 23 2026), with the Nov 24 changes (outer wall
# 200 instead of 100, shells 4 / 3 instead of 5 / 4). Used only to estimate print time and filament.

# --- printer (SV06 ACE, Klipper) ---
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
gcode_flavor = klipper
machine_limits_usage = time_estimate_only
machine_max_feedrate_x = 500,500
machine_max_feedrate_y = 500,500
machine_max_feedrate_z = 12,12
machine_max_acceleration_x = 20000,20000
machine_max_acceleration_y = 20000,20000
machine_max_acceleration_extruding = 20000,20000
machine_max_acceleration_retracting = 5000,5000
machine_max_acceleration_travel = 20000,20000
machine_max_jerk_x = 9,9
machine_max_jerk_y = 9,9
start_gcode = ; START_PRINT (nozzle clean and adaptive bed mesh, a few minutes, not in this estimate)\n
end_gcode = ; END_PRINT\n
retract_length = 0.8
retract_speed = 40
deretract_speed = 40
retract_lift = 0.4
retract_layer_change = 1
retract_before_travel = 2
wipe = 1

# --- filament: Generic PLA @Sovol SV06 ACE with the PLA changes ---
filament_type = PLA
filament_diameter = 1.75
filament_density = 1.24
first_layer_temperature = 220
temperature = 210
first_layer_bed_temperature = 60
bed_temperature = 60
filament_max_volumetric_speed = 18
cooling = 1
fan_always_on = 1
min_fan_speed = 80
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 1
fan_below_layer_time = 60
slowdown_below_layer_time = 6
min_print_speed = 20

# --- process: 0.20mm Standard @Sovol SV06 ACE, standing changes, train-track changes ---
layer_height = 0.2
first_layer_height = 0.25
perimeters = 3
perimeter_generator = classic
external_perimeters_first = 0
top_solid_layers = 4
top_solid_min_thickness = 0.8
bottom_solid_layers = 3
fill_density = 10%
# Orca stock sparse infill is crosshatch 10%; grid is the nearest PrusaSlicer pattern
fill_pattern = grid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
top_one_perimeter_type = topmost
elefant_foot_compensation = 0.15
seam_position = aligned
extrusion_width = 0.4
first_layer_extrusion_width = 0.5
perimeter_extrusion_width = 0.42
external_perimeter_extrusion_width = 0.4
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.4
top_infill_extrusion_width = 0.38
external_perimeter_speed = 200
perimeter_speed = 270
small_perimeter_speed = 50%
top_solid_infill_speed = 200
infill_speed = 300
solid_infill_speed = 200
gap_fill_speed = 200
bridge_speed = 50
first_layer_speed = 30
first_layer_infill_speed = 40
travel_speed = 600
default_acceleration = 10000
external_perimeter_acceleration = 6000
perimeter_acceleration = 8000
top_solid_infill_acceleration = 6000
solid_infill_acceleration = 10000
infill_acceleration = 10000
bridge_acceleration = 10000
first_layer_acceleration = 2000
travel_acceleration = 10000
skirts = 1
skirt_distance = 5
avoid_crossing_perimeters = 0
